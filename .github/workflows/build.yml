
name: Build WordLens APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'WordLens-Android-Project.zip'
      - 'WordLens-Android-Project-complete.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Android project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE=""
          if [ -f "WordLens-Android-Project.zip" ]; then
            ZIP_FILE="WordLens-Android-Project.zip"
          elif [ -f "WordLens-Android-Project-complete.zip" ]; then
            ZIP_FILE="WordLens-Android-Project-complete.zip"
          else
            echo "ERROR: Upload the project ZIP to the repository root."
            exit 1
          fi

          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

          PROJECT_DIR="$(find extracted -type f -name settings.gradle -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "ERROR: ZIP must contain settings.gradle and app/build.gradle."
            find extracted -maxdepth 6 -type f | head -100
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project found: $PROJECT_DIR"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Verify APK
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WordLens-debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
